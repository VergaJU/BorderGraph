[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BorderGraph"
version = "0.1.0"
description = "Package to compute contours and neighborhood graph considering the borders of the cells instead of the centroids. It allows more precise computation of the neighborhood graph."
readme = "README.md"
authors = [{name = "Jacopo Umberto Verga"}]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scanpy>=1.9.0",
    "anndata>=0.8.0",
    "joblib>=1.2.0",
    "scipy>=1.8.0",
    "pandas>=1.5.0",
    "scikit-image>=0.19.0"
]

[project.urls]
"Homepage" = "https://github.com/VergaJU/BorderGraph"
"Repository" = "https://github.com/VergaJU/BorderGraph"
